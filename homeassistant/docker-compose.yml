services:
  # 1. Основной контейнер Home Assistant
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./config:/config
      - ../repos:/repos
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro # Доступ к DBus хоста
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    privileged: true
    network_mode: host
    depends_on:
      - mosquitto

  # 2. MQTT Брокер (Mosquitto)
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - ha-backend


networks:
  ha-backend:
    name: ${HA_BACKEND_NETWORK:-ha-backend}
